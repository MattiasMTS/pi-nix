name: Update Pi Version

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-pi
  cancel-in-progress: false

jobs:
  check-and-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for updates
        id: check
        run: |
          set +e
          ./scripts/update.sh --check
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "update_needed=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 1 ]; then
            current=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)
            latest=$(npm view @earendil-works/pi-coding-agent version)
            {
              echo "current=$current"
              echo "latest=$latest"
              echo "update_needed=true"
            } >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Recover an unfinished release
        if: steps.check.outputs.update_needed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/build-main.sh

      - name: Update version and hashes
        if: steps.check.outputs.update_needed == 'true'
        run: ./scripts/update.sh --version "${{ steps.check.outputs.latest }}"

      - name: Create Pull Request
        if: steps.check.outputs.update_needed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          add-paths: |
            package.nix
            npm-shrinkwrap.json
          commit-message: "chore: update pi-coding-agent to ${{ steps.check.outputs.latest }}"
          title: "chore: update pi-coding-agent to ${{ steps.check.outputs.latest }}"
          body: |
            ## Automated Pi update

            Updates `@earendil-works/pi-coding-agent` from `${{ steps.check.outputs.current }}` to `${{ steps.check.outputs.latest }}`.

            ### Changes
            - Updated `version` in `package.nix`
            - Updated npm release tarball hash
            - Hydrated `npm-shrinkwrap.json` integrity fields
            - Updated `npmDepsHash`

            ### Verification
            - `nix build .#pi-coding-agent`
            - `./result/bin/pi --version`
          branch: update-pi
          delete-branch: true
          labels: |
            dependencies
            automated

      - name: Build and merge update
        if: steps.check.outputs.update_needed == 'true' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.create-pr.outputs.pull-request-head-sha }}
        run: ./scripts/merge-update.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## Update Summary"
            echo ""
            if [ "${{ steps.check.outputs.update_needed }}" = "true" ]; then
              echo "- **Current Version:** ${{ steps.check.outputs.current }}"
              echo "- **Latest Version:** ${{ steps.check.outputs.latest }}"
              echo ""
              echo "- **Update result:** ${{ job.status }} (see build and merge step)"
            elif [ "${{ steps.check.outputs.update_needed }}" = "false" ]; then
              echo "✅ Already up to date."
            else
              echo "Update check did not complete successfully."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
