name: Create Version Tag

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-tags
  cancel-in-progress: false

jobs:
  create-tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Extract version from package.nix
        id: version
        run: |
          version=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check if version tag exists
        id: check-tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create immutable version tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Extract major version
        id: major
        run: |
          major=$(echo "${{ steps.version.outputs.version }}" | cut -d. -f1)
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Update moving tags
        run: |
          # An older build may finish after a newer commit has reached main.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Skipping moving tags because main has advanced."
            exit 0
          fi

          version="${{ steps.version.outputs.version }}"
          major="${{ steps.major.outputs.major }}"

          git tag -fa latest -m "Latest release: v$version"
          git tag -fa "v$major" -m "Latest v$major release: v$version"

          # Publish both together: latest is also the updater's completion marker.
          git push --atomic --force origin refs/tags/latest "refs/tags/v$major"
